project: MI_LOSO_training
device: cuda:0
model: model.MultiBranchCNNLSTM
optimizer: torch.optim.AdamW
epochs: 40
batch_size: 16
seeds: [60]

sstl: false

early_stopping_config:
  enabled: true
  patience: 10

net_config:
  scales_kernels: [31,25,13,7]
  fe_feat_depth: 64
  lstm_hidden_size: 768
  classifier_hidden_dim: 384

optimizer_config:
  lr: 2.89e-4
  w_decay: 5.82e-4

criterion: torch.nn.CrossEntropyLoss

data: datasets.EEGMMIDBDataset

data_preprocessing:
  low_frequency: 0.0
  high_requency: 79.0
  notch_frequency: 50
  apply_ica: false

save_config:
  save_path: 'local/'
  model_save_path: 'models/'
  log_path: 'logs/'
  stats_path: 'data_stats/'

protocol:
  target_channels: ["Fp1","Fp2","AF3","AF4","F7","F3","Fz","F4","F8",
                    "FC5","FC1","FC2","FC6","T7","C3","Cz","C4","T8",
                    "CP5","CP1","CP2","CP6","P7","P3","Pz","P4","P8",
                    "PO7","PO3","PO4","PO8","Oz"]
  n_channels: 32
  sampling_frequency: 160
  event_duration_sec: 4.0
  subjects:
    range: [1, 110]
    exclude: []